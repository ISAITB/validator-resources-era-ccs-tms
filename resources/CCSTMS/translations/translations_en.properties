# --- Additional Information Templates ---

validator.reportItemAdditionalInfoTemplate.0.template = [STRUCTURAL] This error might be because the era:balises property appears multiple times as separate triples instead of one RDF list — only one era:balises property is allowed, and its value must be an RDF list. Or it could be that era:balises is missing entirely. Or it could be that era:balises points to an individual Balise instance rather than to an RDF list. Or the list may contain fewer than 1 or more than 8 items, or contain items that are not valid era:Balise instances. Or it could be that nid_bg is outside the range 0-16383, or nid_c is outside the range 0-1023. Or it could be that linkOrientationDirection or bgFunction has a value not from the defined concept scheme. \n\n\n[BUSINESS RULE] This error might be because two BaliseGroups share the same NID_BG value — but note that NID_BG only needs to be unique within the same NID_C (country ID). If two BaliseGroups have different NID_C values they may share the same NID_BG and that is valid. The uniqueness constraint only applies when NID_C is identical. \n\n\nOr it could be that two Balises within the same group share the same position on a LinearElement (same offsetFromOrigin). Only one Balise instance is permitted at any given position within a group.

validator.reportItemAdditionalInfoTemplate.1.template = [STRUCTURAL] This error might be because the name property appears more than once (at most one is allowed). Or it could be that netPointReference is missing or does not conform to a valid NetPointReference object. \n\n\n[BUSINESS RULE] This error might be because two distinct BufferStop instances are declared at exactly the same position — same LinearElement and same offsetFromOrigin. Each position in the network may only have one BufferStop.

validator.reportItemAdditionalInfoTemplate.2.template = [STRUCTURAL] This error might be because netPointReference is missing or not valid. Or it could be that derailToRight (boolean) or reversalTime (unsigned integer) is missing or appears more than once. Or it could be that name appears more than once. \n\n\n[BUSINESS RULE] This error might be because two distinct Derailer instances share the same position (same LinearElement and same offsetFromOrigin). Note that orientation does not make two derailers at the same position distinct — even if their derailToRight values differ, two derailers at the same location are not permitted.

validator.reportItemAdditionalInfoTemplate.3.template = [STRUCTURAL] This error might be because lengthOfNetLinearElement is missing, appears more than once, or has a value of zero or less — the length must be a positive number greater than 0 metres. Or it could be that name appears more than once. \n\n\n[BUSINESS RULE] This error might be because this LinearElement does not appear as either elementA or elementB in any NetRelation in the dataset. Every LinearElement must be connected to the network topology via at least one NetRelation — a LinearElement that exists in isolation with no NetRelation referencing it is a violation.

validator.reportItemAdditionalInfoTemplate.4.template = [STRUCTURAL] This error might be because horizontalAlignments, verticalAlignments, or cantPoints appears as multiple separate triples instead of one RDF list — each may appear at most once and must point to an RDF list. Or it could be that items in those lists are not valid instances of era:HorizontalSegment, era:VerticalSegment, or era:CantPoint respectively. \n\n\n[BUSINESS RULE] This error might be because a CantSamplePoint is missing at the start position of a HorizontalArc or HorizontalTransition segment — every such segment must have a CantSamplePoint at its starting position. \n\n\nOr it could be that a SlopeSamplePoint is missing at the start position of a VerticalLine or VerticalArc segment. \n\n\nOr it could be that the elementGeometryPos of a horizontal segment (HorizontalLine, HorizontalArc, or HorizontalTransition) exceeds the lengthOfNetLinearElement of the corresponding LinearElement. \n\n\nOr it could be that the elementGeometryPos of a vertical segment (VerticalLine or VerticalArc) exceeds the LinearElement length. \n\n\nOr it could be that the elementGeometryPos of a CantPoint exceeds the LinearElement length.

validator.reportItemAdditionalInfoTemplate.5.template = [STRUCTURAL] This error might be because onElement is missing or does not conform to a valid LinearElement. Or it could be that startOffsetFromOrigin or endOffsetFromOrigin is missing, appears more than once, or is negative. Or it could be that appliesInBothDirections (boolean) is missing. Or it could be that startOffsetFromOrigin is not less than endOffsetFromOrigin. \n\n\n[BUSINESS RULE] This error might be because endOffsetFromOrigin exceeds the lengthOfNetLinearElement of the associated LinearElement — a section cannot extend beyond the end of its LinearElement. \n\n\nOr it could be that startOffsetFromOrigin is greater than endOffsetFromOrigin — the start of a section must not exceed its end position.

validator.reportItemAdditionalInfoTemplate.6.template = [STRUCTURAL] This error might be because sameDirProfile is missing or does not conform to a valid SpeedProfile object — it is required. Or it could be that oppositeDirProfile appears more than once. \n\n\n[BUSINESS RULE] This error might be because the pos of a StaticSpeedLimit exceeds the lengthOfNetLinearElement of the corresponding LinearElement — speed limit positions cannot go beyond the end of the LinearElement. \n\n\nOr it could be that the startPos or endPos of an AxleLoadSpeedProfile exceeds the LinearElement length, or that startPos is greater than endPos.

validator.reportItemAdditionalInfoTemplate.7.template = [STRUCTURAL] This error might be because startsAt or endsAt is missing or does not conform to a valid TopologicalCoordinate. Or it could be that hasSequence appears more than once, or that items in the hasSequence list are not valid era:LinearElement instances. \n\n\n[BUSINESS RULE] This error might be because the LinearElement referenced by startsAt or endsAt also appears inside the hasSequence list — endpoint elements must not be repeated in the sequence. \n\n\nOr it could be that hasSequence is non-empty when startsAt and endsAt reference the same LinearElement — if both endpoints are on the same LinearElement the sequence must be empty. \n\n\nOr it could be that a required NetRelation is missing: for every NetLinearReference with a non-empty hasSequence there must be a NetRelation connecting startsAt to the first sequence element, NetRelations connecting each adjacent sequence pair, and a NetRelation connecting the last sequence element to endsAt.

validator.reportItemAdditionalInfoTemplate.8.template = [STRUCTURAL] This error might be because elementA, isOnOriginOfElementA, elementB, or isOnOriginOfElementB is missing or appears more than once — all four properties are required exactly once. \n\n\n[BUSINESS RULE] This error might be because elementA and elementB reference the same LinearElement — a NetRelation must connect two distinct LinearElements. A self-referencing NetRelation is not permitted.

validator.reportItemAdditionalInfoTemplate.9.template = [STRUCTURAL] This error might be because platformId is missing or appears more than once. Or it could be that linearReference is missing or does not conform to a valid NetLinearReference. Or it could be that platformHeight has a value not from the defined concept scheme. Or it could be that no stopLocations are defined — at least one is required. \n\n\n[BUSINESS RULE] This error might be because a StopLocation associated with this PlatformEdge lies on a LinearElement not covered by the PlatformEdge linearReference. The linearReference defines the extent of the PlatformEdge — every StopLocation must sit on one of those LinearElements within the startsAt and endsAt bounds.

validator.reportItemAdditionalInfoTemplate.10.template = [STRUCTURAL] This error might be because curves, cants, or slopes is missing or not a valid RDF list — all three are required and must each contain at least one item. Or it could be that items in those lists are not valid instances of era:CurveSamplePoint, era:CantSamplePoint, or era:SlopeSamplePoint respectively. \n\n\n[BUSINESS RULE] This error might be because the pos of a CantSamplePoint exceeds the lengthOfNetLinearElement of the corresponding LinearElement. \n\n\nOr it could be that the pos of a SlopeSamplePoint exceeds the LinearElement length. \n\n\nOr it could be that the pos of a CurveSamplePoint exceeds the LinearElement length. \n\n\nIn all three cases, sample point positions must fall within the length of the associated LinearElement.

validator.reportItemAdditionalInfoTemplate.11.template = [STRUCTURAL] This error might be because crossing is missing or does not conform to a valid Crossing object. Or it could be that the number of switches is outside the allowed range of 2 to 4, or that a switch does not conform to a valid Switch object. \n\n\n[BUSINESS RULE] This error might be because this SlipCrossing contains exactly 3 Switch instances. Note that the constraint is specifically against exactly 3 — having 2 or 4 switches may be valid. The number 3 is the only forbidden count.

validator.reportItemAdditionalInfoTemplate.12.template = [STRUCTURAL] This error might be because leftBranch or rightBranch is missing or does not conform to a valid NetRelation object — both are required exactly once. Or it could be that reversalTime is missing or appears more than once. Note: a reversalTime of 0 seconds or greater than 30 seconds is unusual and may indicate a data entry error, though it is not necessarily invalid. \n\n\n[BUSINESS RULE] This error might be because the leftBranch and rightBranch NetRelations do not yield exactly 3 unique (LinearElement, isOnOrigin) flag pairs — every Switch must have exactly 3 such pairs, not 2 or 4. \n\n\nOr it could be that a NetRelation exists directly connecting a LinearElement exclusive to leftBranch with one exclusive to rightBranch — direct connections between exclusive branch elements are not permitted.

validator.reportItemAdditionalInfoTemplate.13.template = [STRUCTURAL] This error might be because linkedArea is missing or does not conform to a valid NetAreaReference object — it is required exactly once. Or it could be that a trainDetector does not conform to a valid TrainDetector object. \n\n\n[BUSINESS RULE] This error might be because a TrainDetector associated with this TvpSection lies on a LinearElement not covered by the TvpSection linkedArea, or because the TrainDetector offsetFromOrigin falls outside the start-to-end bounds of the matching NetLinearReference. The linkedArea defines the precise geometric extent of the TvpSection — every TrainDetector must be positioned strictly within that extent.


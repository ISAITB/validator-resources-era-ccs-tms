# --- Additional Information Templates ---

validator.reportItemAdditionalInfoTemplate.0.template = [STRUKTURELL] Dieser Fehler könnte daran liegen, dass die Eigenschaft era:balises mehrfach als separate Triples statt als eine RDF-Liste vorkommt — nur eine era:balises-Eigenschaft ist erlaubt, und ihr Wert muss eine RDF-Liste sein. Oder es könnte sein, dass era:balises vollständig fehlt. Oder era:balises verweist auf eine einzelne Balise-Instanz statt auf eine RDF-Liste. Oder die Liste enthält weniger als 1 oder mehr als 8 Einträge, oder die Einträge sind keine gültigen era:Balise-Instanzen. Oder nid_bg liegt außerhalb des Bereichs 0–16383, oder nid_c außerhalb des Bereichs 0–1023. Oder linkOrientationDirection oder bgFunction hat einen Wert, der nicht aus dem definierten Konzeptschema stammt. \n\n\n[GESCHÄFTSREGEL] Dieser Fehler könnte daran liegen, dass zwei BaliseGroups denselben NID_BG-Wert teilen — beachten Sie jedoch, dass NID_BG nur innerhalb desselben NID_C (Länder-ID) eindeutig sein muss. Wenn zwei BaliseGroups unterschiedliche NID_C-Werte haben, dürfen sie denselben NID_BG haben. Die Eindeutigkeitsbedingung gilt nur bei identischem NID_C. \n\n\nOder es könnte sein, dass zwei Balises innerhalb derselben Gruppe dieselbe Position auf einem LinearElement teilen (gleicher offsetFromOrigin). An jeder Position darf nur eine Balise-Instanz vorhanden sein.

validator.reportItemAdditionalInfoTemplate.1.template = [STRUKTURELL] Dieser Fehler könnte daran liegen, dass die Eigenschaft name mehr als einmal vorkommt (höchstens einmal erlaubt). Oder netPointReference fehlt oder entspricht keiner gültigen NetPointReference. \n\n\n[GESCHÄFTSREGEL] Dieser Fehler könnte daran liegen, dass zwei verschiedene BufferStop-Instanzen an exakt derselben Position deklariert sind — gleiches LinearElement und gleicher offsetFromOrigin. Jede Position im Netzwerk darf nur einen BufferStop haben.

validator.reportItemAdditionalInfoTemplate.2.template = [STRUKTURELL] Dieser Fehler könnte daran liegen, dass netPointReference fehlt oder ungültig ist. Oder derailToRight (Boolean) oder reversalTime (vorzeichenlose Ganzzahl) fehlt oder kommt mehr als einmal vor. Oder name kommt mehr als einmal vor. \n\n\n[GESCHÄFTSREGEL] Dieser Fehler könnte daran liegen, dass zwei verschiedene Derailer-Instanzen dieselbe Position teilen (gleiches LinearElement und gleicher offsetFromOrigin). Die Ausrichtung macht zwei Entgleisungsvorrichtungen an derselben Position nicht unterschiedlich — selbst wenn ihre derailToRight-Werte verschieden sind, sind zwei Derailèr an derselben Stelle nicht zulässig.

validator.reportItemAdditionalInfoTemplate.3.template = [STRUKTURELL] Dieser Fehler könnte daran liegen, dass lengthOfNetLinearElement fehlt, mehr als einmal vorkommt oder einen Wert von null oder kleiner hat — die Länge muss eine positive Zahl größer als 0 Meter sein. Oder name kommt mehr als einmal vor. \n\n\n[GESCHÄFTSREGEL] Dieser Fehler könnte daran liegen, dass dieses LinearElement weder als elementA noch als elementB in einer NetRelation im Datensatz erscheint. Jedes LinearElement muss über mindestens eine NetRelation mit der Netztopologie verbunden sein — ein LinearElement, das isoliert ohne NetRelation-Verweis existiert, ist ein Verstoß.

validator.reportItemAdditionalInfoTemplate.4.template = [STRUKTURELL] Dieser Fehler könnte daran liegen, dass horizontalAlignments, verticalAlignments oder cantPoints als mehrere separate Triples statt als eine RDF-Liste erscheint — jede Eigenschaft darf höchstens einmal vorkommen und muss auf eine RDF-Liste verweisen. Oder die Einträge in diesen Listen sind keine gültigen Instanzen von era:HorizontalSegment, era:VerticalSegment oder era:CantPoint. \n\n\n[GESCHÄFTSREGEL] Dieser Fehler könnte daran liegen, dass ein CantSamplePoint an der Startposition eines HorizontalArc- oder HorizontalTransition-Segments fehlt — jedes solche Segment muss einen CantSamplePoint an seiner Startposition haben. \n\n\nOder ein SlopeSamplePoint fehlt an der Startposition eines VerticalLine- oder VerticalArc-Segments. \n\n\nOder der elementGeometryPos eines horizontalen Segments (HorizontalLine, HorizontalArc oder HorizontalTransition) überschreitet die lengthOfNetLinearElement des entsprechenden LinearElements. \n\n\nOder der elementGeometryPos eines vertikalen Segments (VerticalLine oder VerticalArc) überschreitet die LinearElement-Länge. \n\n\nOder der elementGeometryPos eines CantPoint überschreitet die LinearElement-Länge.

validator.reportItemAdditionalInfoTemplate.5.template = [STRUKTURELL] Dieser Fehler könnte daran liegen, dass onElement fehlt oder keinem gültigen LinearElement entspricht. Oder startOffsetFromOrigin oder endOffsetFromOrigin fehlt, kommt mehr als einmal vor oder ist negativ. Oder appliesInBothDirections (Boolean) fehlt. Oder startOffsetFromOrigin ist nicht kleiner als endOffsetFromOrigin. \n\n\n[GESCHÄFTSREGEL] Dieser Fehler könnte daran liegen, dass endOffsetFromOrigin die lengthOfNetLinearElement des zugehörigen LinearElements überschreitet — ein Abschnitt darf nicht über das Ende seines LinearElements hinausgehen. \n\n\nOder startOffsetFromOrigin ist größer als endOffsetFromOrigin — der Anfang eines Abschnitts darf seine Endposition nicht überschreiten.

validator.reportItemAdditionalInfoTemplate.6.template = [STRUKTURELL] Dieser Fehler könnte daran liegen, dass sameDirProfile fehlt oder keinem gültigen SpeedProfile-Objekt entspricht — es ist erforderlich. Oder oppositeDirProfile kommt mehr als einmal vor. \n\n\n[GESCHÄFTSREGEL] Dieser Fehler könnte daran liegen, dass der pos eines StaticSpeedLimit die lengthOfNetLinearElement des entsprechenden LinearElements überschreitet — Geschwindigkeitsbegrenzungspositionen dürfen nicht über das Ende des LinearElements hinausgehen. \n\n\nOder der startPos oder endPos eines AxleLoadSpeedProfile überschreitet die LinearElement-Länge, oder startPos ist größer als endPos.

validator.reportItemAdditionalInfoTemplate.7.template = [STRUKTURELL] Dieser Fehler könnte daran liegen, dass startsAt oder endsAt fehlt oder keiner gültigen TopologicalCoordinate entspricht. Oder hasSequence kommt mehr als einmal vor, oder die Einträge in der hasSequence-Liste sind keine gültigen era:LinearElement-Instanzen. \n\n\n[GESCHÄFTSREGEL] Dieser Fehler könnte daran liegen, dass das von startsAt oder endsAt referenzierte LinearElement auch in der hasSequence-Liste vorkommt — Endpunktelemente dürfen nicht in der Sequenz wiederholt werden. \n\n\nOder hasSequence ist nicht leer, obwohl startsAt und endsAt dasselbe LinearElement referenzieren — wenn beide Endpunkte auf demselben LinearElement liegen, muss die Sequenz leer sein. \n\n\nOder eine erforderliche NetRelation fehlt: für jede NetLinearReference mit einer nicht leeren hasSequence muss eine NetRelation existieren, die startsAt mit dem ersten Sequenzelement verbindet, NetRelationen, die jeweils benachbarte Sequenzpaare verbinden, und eine NetRelation, die das letzte Sequenzelement mit endsAt verbindet.

validator.reportItemAdditionalInfoTemplate.8.template = [STRUKTURELL] Dieser Fehler könnte daran liegen, dass elementA, isOnOriginOfElementA, elementB oder isOnOriginOfElementB fehlt oder mehr als einmal vorkommt — alle vier Eigenschaften sind genau einmal erforderlich. \n\n\n[GESCHÄFTSREGEL] Dieser Fehler könnte daran liegen, dass elementA und elementB dasselbe LinearElement referenzieren — eine NetRelation muss zwei verschiedene LinearElements verbinden. Eine selbstreferenzierende NetRelation ist nicht zulässig.

validator.reportItemAdditionalInfoTemplate.9.template = [STRUKTURELL] Dieser Fehler könnte daran liegen, dass platformId fehlt oder mehr als einmal vorkommt. Oder linearReference fehlt oder entspricht keiner gültigen NetLinearReference. Oder platformHeight hat einen Wert, der nicht aus dem definierten Konzeptschema stammt. Oder es sind keine stopLocations definiert — mindestens eine ist erforderlich. \n\n\n[GESCHÄFTSREGEL] Dieser Fehler könnte daran liegen, dass eine mit dieser PlatformEdge verknüpfte StopLocation auf einem LinearElement liegt, das nicht von der linearReference der PlatformEdge abgedeckt wird. Die linearReference definiert die Ausdehnung der PlatformEdge — jede StopLocation muss auf einem dieser LinearElements innerhalb der startsAt- und endsAt-Grenzen liegen.

validator.reportItemAdditionalInfoTemplate.10.template = [STRUKTURELL] Dieser Fehler könnte daran liegen, dass curves, cants oder slopes fehlt oder keine gültige RDF-Liste ist — alle drei sind erforderlich und müssen jeweils mindestens einen Eintrag enthalten. Oder die Einträge in diesen Listen sind keine gültigen Instanzen von era:CurveSamplePoint, era:CantSamplePoint oder era:SlopeSamplePoint. \n\n\n[GESCHÄFTSREGEL] Dieser Fehler könnte daran liegen, dass der pos eines CantSamplePoint die lengthOfNetLinearElement des entsprechenden LinearElements überschreitet. \n\n\nOder der pos eines SlopeSamplePoint überschreitet die LinearElement-Länge. \n\n\nOder der pos eines CurveSamplePoint überschreitet die LinearElement-Länge. \n\n\nIn allen drei Fällen müssen die Samplepunkt-Positionen innerhalb der Länge des zugehörigen LinearElements liegen.

validator.reportItemAdditionalInfoTemplate.11.template = [STRUKTURELL] Dieser Fehler könnte daran liegen, dass crossing fehlt oder keinem gültigen Crossing-Objekt entspricht. Oder die Anzahl der Weichen liegt außerhalb des erlaubten Bereichs von 2 bis 4, oder eine Weiche entspricht keinem gültigen Switch-Objekt. \n\n\n[GESCHÄFTSREGEL] Dieser Fehler könnte daran liegen, dass diese SlipCrossing genau 3 Switch-Instanzen enthält. Beachten Sie, dass die Einschränkung speziell gegen genau 3 gerichtet ist — 2 oder 4 Weichen können gültig sein. Die Zahl 3 ist die einzige verbotene Anzahl.

validator.reportItemAdditionalInfoTemplate.12.template = [STRUKTURELL] Dieser Fehler könnte daran liegen, dass leftBranch oder rightBranch fehlt oder keinem gültigen NetRelation-Objekt entspricht — beide sind genau einmal erforderlich. Oder reversalTime fehlt oder kommt mehr als einmal vor. Hinweis: Eine reversalTime von 0 Sekunden oder mehr als 30 Sekunden ist ungewöhnlich und kann auf einen Dateneingabefehler hinweisen, ist aber nicht unbedingt ungültig. \n\n\n[GESCHÄFTSREGEL] Dieser Fehler könnte daran liegen, dass die leftBranch- und rightBranch-NetRelationen nicht genau 3 eindeutige (LinearElement, isOnOrigin)-Flag-Paare ergeben — jede Weiche muss genau 3 solcher Paare haben, nicht 2 oder 4. \n\n\nOder es existiert eine NetRelation, die direkt ein LinearElement aus leftBranch mit einem aus rightBranch verbindet — direkte Verbindungen zwischen exklusiven Zweig-Elementen sind nicht zulässig.

validator.reportItemAdditionalInfoTemplate.13.template = [STRUKTURELL] Dieser Fehler könnte daran liegen, dass linkedArea fehlt oder keinem gültigen NetAreaReference-Objekt entspricht — es ist genau einmal erforderlich. Oder ein trainDetector entspricht keinem gültigen TrainDetector-Objekt. \n\n\n[GESCHÄFTSREGEL] Dieser Fehler könnte daran liegen, dass ein mit diesem TvpSection verknüpfter TrainDetector auf einem LinearElement liegt, das nicht vom linkedArea des TvpSection abgedeckt wird, oder weil der offsetFromOrigin des TrainDetectors außerhalb der Start-bis-Ende-Grenzen der passenden NetLinearReference liegt. Das linkedArea definiert die genaue geometrische Ausdehnung des TvpSection — jeder TrainDetector muss strikt innerhalb dieser Ausdehnung positioniert sein.


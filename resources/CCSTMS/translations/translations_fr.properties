# --- Additional Information Templates ---

validator.reportItemAdditionalInfoTemplate.0.template = [STRUCTUREL] Cette erreur peut être due au fait que la propriété era:balises apparaît plusieurs fois comme des triplets séparés au lieu d''une liste RDF — une seule propriété era:balises est autorisée et sa valeur doit être une liste RDF. Ou era:balises est totalement absent. Ou era:balises pointe vers une instance Balise individuelle plutôt que vers une liste RDF. Ou la liste peut contenir moins de 1 ou plus de 8 éléments, ou des éléments qui ne sont pas des instances era:Balise valides. Ou nid_bg est en dehors de la plage 0–16383, ou nid_c en dehors de la plage 0–1023. Ou linkOrientationDirection ou bgFunction a une valeur qui ne provient pas du schéma de concepts défini. \n\n\n[RÈGLE MÉTIER] Cette erreur peut être due au fait que deux BaliseGroups partagent la même valeur NID_BG — notez cependant que NID_BG doit uniquement être unique au sein du même NID_C (identifiant de pays). Si deux BaliseGroups ont des valeurs NID_C différentes, ils peuvent partager le même NID_BG et c''est valide. La contrainte d''unicité s''applique uniquement lorsque NID_C est identique. \n\n\nOu il se peut que deux Balises du même groupe partagent la même position sur un LinearElement (même offsetFromOrigin). Une seule instance Balise est autorisée à chaque position donnée dans un groupe.

validator.reportItemAdditionalInfoTemplate.1.template = [STRUCTUREL] Cette erreur peut être due au fait que la propriété name apparaît plus d''une fois (au maximum une seule est autorisée). Ou netPointReference est manquant ou ne correspond pas à un objet NetPointReference valide. \n\n\n[RÈGLE MÉTIER] Cette erreur peut être due au fait que deux instances distinctes de BufferStop sont déclarées à exactement la même position — même LinearElement et même offsetFromOrigin. Chaque position dans le réseau ne peut avoir qu''un seul BufferStop.

validator.reportItemAdditionalInfoTemplate.2.template = [STRUCTUREL] Cette erreur peut être due au fait que netPointReference est manquant ou invalide. Ou derailToRight (booléen) ou reversalTime (entier non signé) est manquant ou apparaît plus d''une fois. Ou name apparaît plus d''une fois. \n\n\n[RÈGLE MÉTIER] Cette erreur peut être due au fait que deux instances distinctes de Derailer partagent la même position (même LinearElement et même offsetFromOrigin). L''orientation ne rend pas deux dérailleurs à la même position distincts — même si leurs valeurs derailToRight diffèrent, deux dérailleurs au même endroit ne sont pas autorisés.

validator.reportItemAdditionalInfoTemplate.3.template = [STRUCTUREL] Cette erreur peut être due au fait que lengthOfNetLinearElement est manquant, apparaît plus d''une fois, ou a une valeur nulle ou négative — la longueur doit être un nombre positif supérieur à 0 mètre. Ou name apparaît plus d''une fois. \n\n\n[RÈGLE MÉTIER] Cette erreur peut être due au fait que ce LinearElement n''apparaît ni comme elementA ni comme elementB dans une NetRelation du jeu de données. Chaque LinearElement doit être connecté à la topologie du réseau via au moins une NetRelation — un LinearElement qui existe isolément sans référence NetRelation est une violation.

validator.reportItemAdditionalInfoTemplate.4.template = [STRUCTUREL] Cette erreur peut être due au fait que horizontalAlignments, verticalAlignments ou cantPoints apparaît comme plusieurs triplets séparés au lieu d''une liste RDF — chacun ne peut apparaître qu''une seule fois et doit pointer vers une liste RDF. Ou les éléments de ces listes ne sont pas des instances valides de era:HorizontalSegment, era:VerticalSegment ou era:CantPoint respectivement. \n\n\n[RÈGLE MÉTIER] Cette erreur peut être due au fait qu''un CantSamplePoint est manquant à la position de début d''un segment HorizontalArc ou HorizontalTransition — chaque segment de ce type doit avoir un CantSamplePoint à sa position de départ. \n\n\nOu un SlopeSamplePoint est manquant à la position de début d''un segment VerticalLine ou VerticalArc. \n\n\nOu l''elementGeometryPos d''un segment horizontal (HorizontalLine, HorizontalArc ou HorizontalTransition) dépasse la lengthOfNetLinearElement du LinearElement correspondant. \n\n\nOu l''elementGeometryPos d''un segment vertical (VerticalLine ou VerticalArc) dépasse la longueur du LinearElement. \n\n\nOu l''elementGeometryPos d''un CantPoint dépasse la longueur du LinearElement.

validator.reportItemAdditionalInfoTemplate.5.template = [STRUCTUREL] Cette erreur peut être due au fait que onElement est manquant ou ne correspond pas à un LinearElement valide. Ou startOffsetFromOrigin ou endOffsetFromOrigin est manquant, apparaît plus d''une fois ou est négatif. Ou appliesInBothDirections (booléen) est manquant. Ou startOffsetFromOrigin n''est pas inférieur à endOffsetFromOrigin. \n\n\n[RÈGLE MÉTIER] Cette erreur peut être due au fait que endOffsetFromOrigin dépasse la lengthOfNetLinearElement du LinearElement associé — une section ne peut pas s''étendre au-delà de la fin de son LinearElement. \n\n\nOu startOffsetFromOrigin est supérieur à endOffsetFromOrigin — le début d''une section ne doit pas dépasser sa position de fin.

validator.reportItemAdditionalInfoTemplate.6.template = [STRUCTUREL] Cette erreur peut être due au fait que sameDirProfile est manquant ou ne correspond pas à un objet SpeedProfile valide — il est obligatoire. Ou oppositeDirProfile apparaît plus d''une fois. \n\n\n[RÈGLE MÉTIER] Cette erreur peut être due au fait que le pos d''un StaticSpeedLimit dépasse la lengthOfNetLinearElement du LinearElement correspondant — les positions de limitation de vitesse ne peuvent pas dépasser la fin du LinearElement. \n\n\nOu le startPos ou endPos d''un AxleLoadSpeedProfile dépasse la longueur du LinearElement, ou startPos est supérieur à endPos.

validator.reportItemAdditionalInfoTemplate.7.template = [STRUCTUREL] Cette erreur peut être due au fait que startsAt ou endsAt est manquant ou ne correspond pas à une TopologicalCoordinate valide. Ou hasSequence apparaît plus d''une fois, ou les éléments de la liste hasSequence ne sont pas des instances era:LinearElement valides. \n\n\n[RÈGLE MÉTIER] Cette erreur peut être due au fait que le LinearElement référencé par startsAt ou endsAt apparaît également dans la liste hasSequence — les éléments d''extrémité ne doivent pas être répétés dans la séquence. \n\n\nOu hasSequence n''est pas vide alors que startsAt et endsAt référencent le même LinearElement — si les deux extrémités sont sur le même LinearElement, la séquence doit être vide. \n\n\nOu une NetRelation requise est manquante : pour chaque NetLinearReference avec une hasSequence non vide, il doit exister une NetRelation reliant startsAt au premier élément de la séquence, des NetRelations reliant chaque paire adjacente d''éléments de séquence, et une NetRelation reliant le dernier élément de la séquence à endsAt.

validator.reportItemAdditionalInfoTemplate.8.template = [STRUCTUREL] Cette erreur peut être due au fait que elementA, isOnOriginOfElementA, elementB ou isOnOriginOfElementB est manquant ou apparaît plus d''une fois — les quatre propriétés sont obligatoires exactement une fois. \n\n\n[RÈGLE MÉTIER] Cette erreur peut être due au fait que elementA et elementB référencent le même LinearElement — une NetRelation doit connecter deux LinearElements distincts. Une NetRelation auto-référencée n''est pas autorisée.

validator.reportItemAdditionalInfoTemplate.9.template = [STRUCTUREL] Cette erreur peut être due au fait que platformId est manquant ou apparaît plus d''une fois. Ou linearReference est manquant ou ne correspond pas à une NetLinearReference valide. Ou platformHeight a une valeur qui ne provient pas du schéma de concepts défini. Ou aucune stopLocation n''est définie — au moins une est obligatoire. \n\n\n[RÈGLE MÉTIER] Cette erreur peut être due au fait qu''une StopLocation associée à cette PlatformEdge se trouve sur un LinearElement non couvert par la linearReference de la PlatformEdge. La linearReference définit l''étendue de la PlatformEdge — chaque StopLocation doit se trouver sur l''un de ces LinearElements dans les limites de startsAt et endsAt.

validator.reportItemAdditionalInfoTemplate.10.template = [STRUCTUREL] Cette erreur peut être due au fait que curves, cants ou slopes est manquant ou n''est pas une liste RDF valide — les trois sont obligatoires et doivent chacun contenir au moins un élément. Ou les éléments de ces listes ne sont pas des instances valides de era:CurveSamplePoint, era:CantSamplePoint ou era:SlopeSamplePoint respectivement. \n\n\n[RÈGLE MÉTIER] Cette erreur peut être due au fait que le pos d''un CantSamplePoint dépasse la lengthOfNetLinearElement du LinearElement correspondant. \n\n\nOu le pos d''un SlopeSamplePoint dépasse la longueur du LinearElement. \n\n\nOu le pos d''un CurveSamplePoint dépasse la longueur du LinearElement. \n\n\nDans les trois cas, les positions des points d''échantillonnage doivent se situer dans la longueur du LinearElement associé.

validator.reportItemAdditionalInfoTemplate.11.template = [STRUCTUREL] Cette erreur peut être due au fait que crossing est manquant ou ne correspond pas à un objet Crossing valide. Ou le nombre d''aiguillages est en dehors de la plage autorisée de 2 à 4, ou un aiguillage ne correspond pas à un objet Switch valide. \n\n\n[RÈGLE MÉTIER] Cette erreur peut être due au fait que cette SlipCrossing contient exactement 3 instances de Switch. Notez que la contrainte est spécifiquement contre exactement 3 — avoir 2 ou 4 aiguillages peut être valide. Le nombre 3 est le seul nombre interdit.

validator.reportItemAdditionalInfoTemplate.12.template = [STRUCTUREL] Cette erreur peut être due au fait que leftBranch ou rightBranch est manquant ou ne correspond pas à un objet NetRelation valide — les deux sont obligatoires exactement une fois. Ou reversalTime est manquant ou apparaît plus d''une fois. Remarque : un reversalTime de 0 seconde ou supérieur à 30 secondes est inhabituel et peut indiquer une erreur de saisie, bien que ce ne soit pas nécessairement invalide. \n\n\n[RÈGLE MÉTIER] Cette erreur peut être due au fait que les NetRelations leftBranch et rightBranch ne donnent pas exactement 3 paires uniques (LinearElement, isOnOrigin) — chaque Switch doit avoir exactement 3 paires de ce type, ni 2 ni 4. \n\n\nOu il existe une NetRelation connectant directement un LinearElement exclusif à leftBranch avec un LinearElement exclusif à rightBranch — les connexions directes entre éléments exclusifs de branches ne sont pas autorisées.

validator.reportItemAdditionalInfoTemplate.13.template = [STRUCTUREL] Cette erreur peut être due au fait que linkedArea est manquant ou ne correspond pas à un objet NetAreaReference valide — il est obligatoire exactement une fois. Ou un trainDetector ne correspond pas à un objet TrainDetector valide. \n\n\n[RÈGLE MÉTIER] Cette erreur peut être due au fait qu''un TrainDetector associé à ce TvpSection se trouve sur un LinearElement non couvert par le linkedArea du TvpSection, ou parce que l''offsetFromOrigin du TrainDetector est en dehors des limites début-fin de la NetLinearReference correspondante. Le linkedArea définit l''étendue géométrique précise du TvpSection — chaque TrainDetector doit être positionné strictement dans cette étendue.

